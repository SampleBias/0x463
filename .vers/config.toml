version = "0.1"
timeout_seconds = 300

[[runtime]]
name = "independent fixture regeneration and tamper check"
argv = ["python3", "fixtures/tools/independent_vector.py"]
expected_exit = 0
stdout = """order_id=8ed07cfeafd6b86b5c1a4501912ec6f1984442f1247bd79aca2a2f166433b51c
policy_hash=caadaf810c19a779b80c08c6493ec2ecfde3fb8f56f15baa449b7897db2a5f4b
message_id=ac78a7245326764d548f13907645c1ffcaf926da6a24292f4ca480e45d668004
worked_messages=7 negative_examples=10 receipt_id=22eb00b33ea53cb39763aa1907dc35bc47327d115f5e2c8d148fef447a5a627b
"""
stderr = ""

[[runtime]]
name = "two parties fund an isolated simulator order"
argv = ["cargo", "run", "--quiet", "--offline", "--locked", "-p", "settle463-sdk", "--example", "negotiate"]
expected_exit = 0
stdout = "Funded held=2000000 paid=0 refunded=0 buyer_balance=3000000 seller_balance=0\n"
stderr = ""

[[runtime]]
name = "verify the independently signed reference bundle offline"
argv = [
  "cargo", "run", "--quiet", "--offline", "--locked", "-p", "settle463", "--",
  "receipt", "verify", "spec/examples/worked-transaction/bundle.json", "--offline",
  "--environment", "sim:fixture",
  "--trusted-order", "8ed07cfeafd6b86b5c1a4501912ec6f1984442f1247bd79aca2a2f166433b51c",
  "--trusted-issuer", "23fbe6e3f13af792e9ed982cfa5db5cba90019781f217ffd8642c13e3a10a91a",
]
expected_exit = 0
stdout = "evidence_signed\n"
stderr = ""

[[runtime]]
name = "reject an issuer outside the caller's trust input"
argv = [
  "cargo", "run", "--quiet", "--offline", "--locked", "-p", "settle463", "--",
  "receipt", "verify", "spec/examples/worked-transaction/bundle.json", "--offline",
  "--environment", "sim:fixture",
  "--trusted-order", "8ed07cfeafd6b86b5c1a4501912ec6f1984442f1247bd79aca2a2f166433b51c",
  "--trusted-issuer", "1111111111111111111111111111111111111111111111111111111111111111",
]
expected_exit = 3
stdout = "untrusted\n"
stderr = ""
