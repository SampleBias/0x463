[package]
name = "settle463d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "=0.8.8"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
getrandom = "0.2"
settle463-core = { path = "../../crates/settle463-core" }
settle463-sim = { path = "../../crates/settle463-sim" }
