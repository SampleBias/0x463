name: Phase D registry preparation
on:
  push:
    branches: [build/phase-d-validator]
    paths: ['.github/workflows/phase-d-cache.yml', '**/Cargo.toml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve pinned Rust dependencies
        run: |
          cp Cargo.lock "$RUNNER_TEMP/phase-c.lock"
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo fetch
      - name: Export checksum-bound registry inputs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, os, pathlib, tarfile, tomllib
          from pathlib import Path
          reg="registry+https://github.com/rust-lang/crates.io-index"
          def packages(lock):
              return {(p["name"],p["version"]): p["checksum"] for p in tomllib.loads(lock.read_text())["package"] if p.get("source")==reg}
          lock=Path("Cargo.lock")
          previous=packages(Path(os.environ["RUNNER_TEMP"],"phase-c.lock"))
          registry=Path.home()/".cargo/registry"
          cache=next((registry/"cache").glob("index.crates.io-*"))
          index=next((registry/"index").glob("index.crates.io-*"))/".cache"
          shard=int(os.environ["SHARD"])
          def bucket(name):
              return hashlib.sha256(name.encode()).digest()[0]%8
          stream=io.BytesIO()
          with tarfile.open(fileobj=stream, mode="w:gz") as tar:
              if shard==0: tar.add(lock,"Cargo.lock")
              names=set()
              for (name,version),checksum in sorted(packages(lock).items()):
                  if bucket(name)!=shard or (name,version) in previous: continue
                  p=cache/f"{name}-{version}.crate"
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==checksum
                  tar.add(p,"crates/"+p.name)
                  names.add(name)
              for name in sorted(names):
                  prefix=str(len(name)) if len(name)<3 else "3/"+name[0] if len(name)==3 else name[:2]+"/"+name[2:4]
                  tar.add(index/prefix/name,"index/"+prefix+"/"+name)
          data=base64.b64encode(stream.getvalue()).decode()
          print("REGISTRY_DIGEST",shard,hashlib.sha256(stream.getvalue()).hexdigest(),len(data))
          for i in range(0,len(data),18000): print("REGISTRY_DATA",i,data[i:i+18000])
          PY
