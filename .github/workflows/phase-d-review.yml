name: Verify Phase D candidate
on:
  push:
    branches: [build/phase-d-validator]
    paths: ['.github/workflows/phase-d-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  vers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Identify the final checkout by its reviewed Git tree
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            revision=$(gh api repos/SampleBias/0x463/git/ref/heads/build/phase-d-validator --jq .object.sha)
            tree=$(gh api "repos/SampleBias/0x463/git/commits/$revision" --jq .tree.sha)
            if [[ "$tree" == "4901523c8f9f1dd45aceadbe722a8bd963ff9857" ]]; then
              echo "revision=$revision" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.target.outputs.revision }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SampleBias/skillz_library
          ref: 2dbf0d64f516034458e483c31a8e76a44d78b7a1
          path: gate
          persist-credentials: false
      - name: Build the native SQLite used by the daemon
        working-directory: candidate
        run: bash scripts/ci-sqlite.sh
      - name: Prepare pinned tools and offline Rust dependencies
        working-directory: candidate
        run: |
          python3 -m venv "$RUNNER_TEMP/vers-python"
          "$RUNNER_TEMP/vers-python/bin/pip" install cryptography==50.0.2
          echo "$RUNNER_TEMP/vers-python/bin" >> "$GITHUB_PATH"
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo build --locked --manifest-path "$GITHUB_WORKSPACE/gate/skills/vers/Cargo.toml" --target-dir "$RUNNER_TEMP/harness"
      - name: Load the independent, digest-checked review records
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib
          files=json.loads(gzip.decompress(base64.b64decode("",validate=True)))
          root=pathlib.Path(os.environ["RUNNER_TEMP"],"independent-records")
          root.mkdir()
          for name, data in files.items():
              assert pathlib.Path(name).name==name
              (root/name).write_bytes(data.encode())
          for record in json.loads((root/"bundle.json").read_bytes())["reviews"]:
              assert hashlib.sha256((root/record["artifact"]).read_bytes()).hexdigest()==record["artifact_sha256"]
          PY
          sudo chown -R root:root "$RUNNER_TEMP/independent-records"
          sudo chmod -R a-w "$RUNNER_TEMP/independent-records"
      - name: Run the full VERS workspace and runtime gates
        working-directory: candidate
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          "$RUNNER_TEMP/harness/debug/vers" --root "$PWD" --full --execute --review-policy "$RUNNER_TEMP/independent-records/policy.json" --review-bundle "$RUNNER_TEMP/independent-records/bundle.json" --trust-reviews
      - name: Record the VERS verdict and reviewed evidence
        if: always()
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(next(Path('.vers/reports').glob('*/report.json')).read_bytes())
          print('VERS_JSON='+json.dumps(report,separators=(',',':')))
          for c in report['checks']:
              if c['status'] in ('FAIL','BLOCKED'):
                  print(c['id'],c['detail'])
                  if c.get('evidence'):
                      p=next(Path('.vers/reports').glob('*/report.json')).parent / c['evidence']
                      if p.is_file(): print(p.read_text()[-3000:])
          PY
      - name: Retain the verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-d-rust-verification
          path: candidate/.vers/reports/
          include-hidden-files: true
          if-no-files-found: error
      - name: Return published evidence for a separate offline rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/SampleBias/0x463/actions/artifacts/14955358242/zip' > "$RUNNER_TEMP/public.zip"
          python3 - <<'PY'
          import base64, json, os, zipfile, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"],"public.zip")
          cases=["pass","bad-artifact","no-delivery","verifier-offline"]
          with zipfile.ZipFile(p) as z:
              names={n for n in z.namelist() if not n.endswith("/")}
              assert {f"{c}/{n}" for c in cases for n in ["receipt.json", "trust.json", "evidence.json", "demo.stdout"]} <= names
              for case in cases:
                  assert {"environment","trusted_issuer","trusted_order","genesis","program_id"} <= set(json.loads(z.read(f"{case}/trust.json")))
                  for name in ["receipt.json","trust.json","demo.stdout","evidence.json"]:
                      path=f"{case}/{name}"
                      print("PUBLIC_EVIDENCE "+path+" "+base64.b64encode(z.read(path)).decode())
          PY
