name: Phase A toolchain spike
on:
  push:
    branches: [build/phase-a0-spike]
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Anchor 1.2.2 and Agave 4.1.2
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output anchor https://github.com/otter-sec/anchor/releases/download/v1.2.2/anchor-1.2.2-x86_64-unknown-linux-gnu
          curl --fail --location --retry 3 --output agave.tar.bz2 https://github.com/anza-xyz/agave/releases/download/v4.1.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo 'e2c35a973bcfe476f3a89b120e99820f917229faf33d3e71f6625bd94199e741  anchor' | sha256sum --check
          echo '5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770  agave.tar.bz2' | sha256sum --check
          install -Dm755 anchor "$RUNNER_TEMP/anchor-bin/anchor"
          tar -xjf agave.tar.bz2
          echo "$RUNNER_TEMP/anchor-bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Build, deploy and invoke on the local validator
        run: |
          rustc -Vv
          cargo -V
          bash scripts/phase-a0-spike.sh
