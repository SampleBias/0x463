name: Domain conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare fixture verifier
        run: |
          python3 -m venv "$RUNNER_TEMP/fixture-env"
          "$RUNNER_TEMP/fixture-env/bin/pip" install cryptography==50.0.2
          echo "$RUNNER_TEMP/fixture-env/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy -p settle463-core --all-targets -- -D warnings
      - run: cargo test --locked -p settle463-core
      - run: python3 fixtures/tools/independent_vector.py
