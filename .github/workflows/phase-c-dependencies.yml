          shard=int(os.environ["SLICE"])
          for index,(filename,(package,checksum)) in enumerate(files.items()):
              large=package=="libsqlite3-sys"
              if not large and index%4!=shard: continue
              with urllib.request.urlopen(f"https://static.crates.io/crates/{package}/{filename}") as f:
                  data=f.read()
              if hashlib.sha256(data).hexdigest()!=checksum: raise ValueError(filename)
              encoded=base64.b64encode(data).decode()
              for i in range(0,len(encoded),4096):
                  if not large or (i//4096)%4==shard:
                      print("C_CRATE",filename,i,encoded[i:i+4096])
