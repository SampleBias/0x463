[package]
name = "settle463-solana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settle463-core = { path = "../settle463-core" }
sha2 = "0.10"
solana-instruction = "=3.0.0"
solana-message = { version = "=3.0.1", features = ["bincode"] }
solana-pubkey = { version = "=3.0.0", features = ["curve25519"] }
thiserror = "2"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "json"] }
